# THIS WORKFLOW IS INTENTIONALLY DISABLED.
#
# Deployment no longer flows through GitHub Actions. Instead, HKaliyun runs
# a webhook receiver (port 3101) that GitHub POSTs to on every push to main.
# See /opt/me2603-webhook on HKaliyun and /var/www/ME2603/scripts/deploy.sh.
#
# This file is kept as a placeholder so future readers don't accidentally
# re-introduce SSH-from-GitHub-Actions deploys. If you want to re-enable
# CI-driven deploys, do it in a brand-new workflow file rather than
# uncommenting below — the SSH key in secrets would need re-issuing too.

name: CI
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: noop
        run: |
          echo "This workflow is a no-op. Deploys happen via the webhook receiver on HKaliyun (port 3101)."
          echo "See .github/workflows/deploy.yml header for context."